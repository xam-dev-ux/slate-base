[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
base = true
bytecode_hash = "none"
cbor_metadata = false
via_ir = true

remappings = [
    "base-std/=lib/base-std/src/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
